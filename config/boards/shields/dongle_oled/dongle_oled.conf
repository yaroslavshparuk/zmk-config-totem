# Keep the screen awake longer than the 30s default; the dongle is USB powered.
CONFIG_ZMK_IDLE_TIMEOUT=60000

# zmk-dongle-display widget options (CONFIG_ZMK_DISPLAY and peripheral battery
# fetching are already enabled by the dongle_display shield itself).
# CONFIG_ZMK_DONGLE_DISPLAY_WPM=y
# CONFIG_ZMK_DONGLE_DISPLAY_MAC_MODIFIERS=y
# CONFIG_ZMK_DONGLE_DISPLAY_LAYER_TEXT_ALIGN="left"

# For a 128x32 panel, drop widgets that do not fit and shrink the draw buffer:
# CONFIG_ZMK_DONGLE_DISPLAY_BONGO_CAT=n
# CONFIG_ZMK_DONGLE_DISPLAY_MODIFIERS=n
# CONFIG_ZMK_DONGLE_DISPLAY_LAYER=n
# CONFIG_LV_Z_VDB_SIZE=32
