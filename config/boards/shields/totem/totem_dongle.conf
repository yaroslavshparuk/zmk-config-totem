# The dongle is USB powered, so never sleep.
CONFIG_ZMK_SLEEP=n

# Forward the halves' battery levels on to the host as well as the screen.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

# --- YADS dongle screen (zmk-dongle-screen) ---
CONFIG_DONGLE_SCREEN_HORIZONTAL=y
CONFIG_DONGLE_SCREEN_FLIPPED=n

# 0: macOS, 1: Linux, 2: Windows
CONFIG_DONGLE_SCREEN_SYSTEM_ICON=1

CONFIG_DONGLE_SCREEN_IDLE_TIMEOUT_S=300
CONFIG_DONGLE_SCREEN_MAX_BRIGHTNESS=80
CONFIG_DONGLE_SCREEN_MIN_BRIGHTNESS=5
CONFIG_DONGLE_SCREEN_BRIGHTNESS_STEP=10

# Prospector carries an APDS9960 ambient light sensor. Set this to `n` if your
# build has no sensor fitted, and use CONFIG_DONGLE_SCREEN_DEFAULT_BRIGHTNESS
# instead.
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT=y
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT_MIN_RAW_VALUE=7
CONFIG_DONGLE_SCREEN_AMBIENT_LIGHT_MAX_RAW_VALUE=3000

# Widgets
CONFIG_DONGLE_SCREEN_OUTPUT_ACTIVE=y
CONFIG_DONGLE_SCREEN_LAYER_ACTIVE=y
CONFIG_DONGLE_SCREEN_MODIFIER_ACTIVE=y
CONFIG_DONGLE_SCREEN_BATTERY_ACTIVE=y
CONFIG_DONGLE_SCREEN_WPM_ACTIVE=y

# F22 toggles the screen, F23/F24 dim/brighten it (bind them in the keymap).
CONFIG_DONGLE_SCREEN_BRIGHTNESS_KEYBOARD_CONTROL=y
